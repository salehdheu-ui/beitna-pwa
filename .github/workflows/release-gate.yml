name: Release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  critical-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check server/server.js
          node --check scripts/check.js
          node --check scripts/security-test.js
      - name: Structural and PWA checks
        run: node scripts/check.js
      - name: Authorization, session, invite, and backup integration tests
        run: node scripts/security-test.js
